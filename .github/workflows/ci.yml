name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun.lock` is committed; run `bun install` once locally to create it.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build the GUI bundle
        run: bun run build

      - name: Test the status domain
        run: bun test

      - name: The bundle is one CommonJS file
        run: test -f dist/gui-experimental.cjs
